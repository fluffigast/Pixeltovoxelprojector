<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Motion Detector (WASM)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0f0a; color: #d6ffd6; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .wrap { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  .stage { position: relative; background: #000; display: grid; place-items: center; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100%; }
  .stage video { visibility: hidden; }
  .side { background: #0f1a0f; border-left: 1px solid #1f3a1f; padding: 16px; overflow: auto; }
  h1 { font-size: 16px; margin: 0 0 12px; color: #7fff7f; letter-spacing: .5px; }
  h2 { font-size: 12px; margin: 16px 0 6px; color: #7fff7f; text-transform: uppercase; letter-spacing: 1px; }
  label { display: block; margin: 6px 0 2px; font-size: 11px; color: #a0d0a0; text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], select { width: 100%; box-sizing: border-box; background: #050a05; color: #d6ffd6; border: 1px solid #2a4a2a; padding: 6px 8px; font: inherit; border-radius: 3px; }
  input[type=range] { width: 100%; }
  input[type=file] { font: inherit; color: #a0d0a0; }
  button { background: #1f3a1f; color: #d6ffd6; border: 1px solid #2a4a2a; padding: 6px 10px; font: inherit; cursor: pointer; border-radius: 3px; }
  button:hover { background: #2a4a2a; }
  button.primary { background: #2d5a2d; border-color: #4a7a4a; }
  button.primary:hover { background: #4a7a4a; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row > * { flex: 1; }
  .stats { font-size: 12px; color: #a0d0a0; line-height: 1.8; }
  .stats span { color: #7fff7f; float: right; }
  .status { font-size: 11px; color: #a0d0a0; margin-top: 8px; min-height: 1.4em; }
  .status.err { color: #ff6a6a; }
  .audit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
  .audit-grid .cell { position: relative; cursor: pointer; border: 1px solid #2a4a2a; background: #000; }
  .audit-grid .cell img { display: block; width: 100%; height: auto; }
  .audit-grid .cell .lbl { position: absolute; left: 2px; bottom: 2px; font-size: 9px; background: rgba(0,0,0,.7); color: #d6ffd6; padding: 1px 3px; border-radius: 2px; }
  .audit-grid .cell.hit { border-color: #4a7a4a; }
  .audit-grid .cell.miss { border-color: #7a4a4a; }
  .audit-grid .cell.pending { border-color: #7a7a4a; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.show { display: flex; }
  .modal .card { background: #0f1a0f; border: 1px solid #2a4a2a; padding: 12px; max-width: 90vw; max-height: 90vh; overflow: auto; }
  .modal canvas { display: block; max-width: 86vw; max-height: 70vh; background: #000; }
  .modal .meta { font-size: 12px; color: #a0d0a0; margin-top: 8px; }
  .modal .meta span { color: #7fff7f; }
  .modal .nav { margin-top: 8px; display: flex; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="video" playsinline muted crossorigin="anonymous"></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="side">
    <h1>Motion Detector · WASM</h1>

    <h2>Source</h2>
    <label>Mode</label>
    <select id="mode">
      <option value="webcam">Webcam</option>
      <option value="url" selected>URL</option>
      <option value="file">Upload file</option>
    </select>
    <label>Video URL</label>
    <input id="url" type="text" placeholder="https://.../video.mp4" value="" />
    <label>Upload</label>
    <input id="file" type="file" accept="video/*" />
    <div class="row">
      <button id="start" class="primary">Start</button>
      <button id="stop">Stop</button>
    </div>

    <h2>Detection</h2>
    <label>Fixed threshold floor <span id="thrv">10</span></label>
    <input id="thr" type="range" min="2" max="80" value="10" />
    <label>Adaptive k·std <span id="kv">2.0</span></label>
    <input id="k" type="range" min="0" max="500" value="200" />
    <label>Min area <span id="minv">3</span></label>
    <input id="min" type="range" min="1" max="200" value="3" />
    <label>Max area <span id="maxv">2000</span></label>
    <input id="max" type="range" min="50" max="20000" value="2000" />
    <label><input id="morph" type="checkbox" checked /> Morphology open (3×3)</label>
    <label>Camera-motion gate <span id="gatev">0.20</span></label>
    <input id="gate" type="range" min="50" max="500" value="200" />

    <h2>Turret (WebSerial)</h2>
    <div class="row">
      <button id="serConnect">Connect</button>
      <button id="serDisconnect">Disconnect</button>
    </div>
    <label>Fire mode</label>
    <select id="fireMode">
      <option value="off" selected>Off (aim only, no fire bit)</option>
      <option value="dry">Dry run (log, don't send)</option>
      <option value="live">Live (send fire=1 when inside zone)</option>
    </select>
    <label>Target pick</label>
    <select id="targetPick">
      <option value="largest" selected>Largest area</option>
      <option value="center">Closest to center</option>
      <option value="fastest">Fastest moving</option>
    </select>
    <label>Lead time (ms) <span id="leadv">20</span></label>
    <input id="lead" type="range" min="0" max="200" value="20" />
    <label>Kill-zone (fraction of frame) <span id="kzv">0.6</span></label>
    <input id="kz" type="range" min="0" max="100" value="60" />
    <div id="serStatus" class="status">Not connected.</div>

    <h2>Hit audit</h2>
    <div class="stats">
      <div>Would-fire events <span id="s_cap">0</span></div>
      <div>Mean aim error <span id="s_err">—</span></div>
      <div>Hit rate (&lt;8 px) <span id="s_hits">—</span></div>
    </div>
    <div class="row"><button id="auditExport">Export audit JSON</button></div>

    <h2>Tracking</h2>
    <label>Persistence (hits of last 5) <span id="persv">2</span></label>
    <input id="pers" type="range" min="1" max="5" value="2" />
    <label>Track radius (px) <span id="radv">15</span></label>
    <input id="rad" type="range" min="5" max="80" value="15" />
    <label>Min spread (px, 0=off) <span id="spreadv">6</span></label>
    <input id="spread" type="range" min="0" max="40" value="6" />
    <label>Spread window (frames) <span id="swinv">8</span></label>
    <input id="swin" type="range" min="3" max="20" value="8" />

    <h2>Stats</h2>
    <div class="stats">
      <div>Frame <span id="s_frame">—</span></div>
      <div>Resolution <span id="s_res">—</span></div>
      <div>FPS <span id="s_fps">—</span></div>
      <div>WASM detect <span id="s_wtime">—</span></div>
      <div>Raw blobs <span id="s_raw">—</span></div>
      <div>Stationary <span id="s_stat">—</span></div>
      <div>Confirmed tracks <span id="s_dets">—</span></div>
    </div>

    <div id="status" class="status"></div>
  </div>
</div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const workCanvas = document.createElement('canvas');
const wctx = workCanvas.getContext('2d', { willReadFrequently: true });

const el = (id) => document.getElementById(id);
const status = el('status');
function say(msg, err = false) { status.textContent = msg; status.className = 'status' + (err ? ' err' : ''); }

// ---- WASM setup ----
let wasm = null;
let memory = null;
const INITIAL_PAGES = 64; // 4 MiB
const MAX_PAGES = 4096;   // 256 MiB

async function initWasm() {
  memory = new WebAssembly.Memory({ initial: INITIAL_PAGES, maximum: MAX_PAGES });
  const bytes = b64ToBytes(WASM_B64);
  const mod = await WebAssembly.instantiate(bytes, { env: { memory } });
  wasm = mod.instance.exports;
  say('WASM ready (' + bytes.length + ' bytes).');
}

let frameBufPtr = 0;
let frameBufLen = 0;
function ensureFrameBuf(bytes) {
  if (frameBufLen >= bytes) return;
  if (frameBufPtr) wasm.dealloc(frameBufPtr, frameBufLen);
  frameBufPtr = wasm.alloc(bytes);
  frameBufLen = bytes;
}

function readDetections(ptr) {
  const countF32 = new Float32Array(memory.buffer, ptr, 1);
  const count = countF32[0] | 0;
  const data = new Float32Array(memory.buffer, ptr + 4, count * 7);
  const dets = [];
  for (let i = 0; i < count; i++) {
    const o = i * 7;
    dets.push({
      cx: data[o], cy: data[o + 1], w: data[o + 2], h: data[o + 3],
      area: data[o + 4], aspect: data[o + 5], compact: data[o + 6]
    });
  }
  return dets;
}

// ---- Sources ----
let currentStream = null;
async function setMode(mode) {
  stopLoop();
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  video.srcObject = null; video.src = '';
  wasm && wasm.reset();
  tracker.reset();

  if (mode === 'webcam') {
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = currentStream;
      await video.play();
      say('Webcam active.');
    } catch (e) { say('Webcam error: ' + e.message, true); return; }
  } else if (mode === 'url') {
    const u = el('url').value.trim();
    if (!u) { say('Enter a URL.', true); return; }
    video.src = u;
    video.loop = true;
    try { await video.play(); say('Playing URL.'); }
    catch (e) { say('URL play error: ' + e.message + ' (CORS may block pixel access).', true); }
  } else if (mode === 'file') {
    const f = el('file').files[0];
    if (!f) { say('Choose a file.', true); return; }
    video.src = URL.createObjectURL(f);
    video.loop = true;
    try { await video.play(); say('Playing file: ' + f.name); }
    catch (e) { say('File play error: ' + e.message, true); }
  }
  startLoop();
}

// ---- Loop ----
let running = false;
let frameN = 0, fpsFrames = 0, fpsT0 = performance.now();
let lastWTime = 0;

function stopLoop() { running = false; }
function startLoop() {
  if (running) return;
  running = true;
  frameN = 0; fpsFrames = 0; fpsT0 = performance.now();
  requestAnimationFrame(step);
}

function step() {
  if (!running) return;
  if (!wasm) { requestAnimationFrame(step); return; }
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw && vh && !video.paused) {
    // Scale down big videos for perf; keep aspect.
    const maxDim = 960;
    const scale = Math.min(1, maxDim / Math.max(vw, vh));
    const w = Math.max(2, Math.round(vw * scale));
    const h = Math.max(2, Math.round(vh * scale));

    if (workCanvas.width !== w || workCanvas.height !== h) {
      workCanvas.width = w; workCanvas.height = h;
      overlay.width = w; overlay.height = h;
      wasm.reset();
    }
    wctx.drawImage(video, 0, 0, w, h);
    let img;
    try { img = wctx.getImageData(0, 0, w, h); }
    catch (e) { say('Pixel read blocked (CORS). Try a same-origin URL or upload.', true); running = false; return; }

    const nBytes = w * h * 4;
    ensureFrameBuf(nBytes);
    new Uint8Array(memory.buffer, frameBufPtr, nBytes).set(img.data);

    const thr = +el('thr').value, mn = +el('min').value, mx = +el('max').value;
    const kStd100 = +el('k').value;             // k·100
    const gateX1000 = +el('gate').value;        // 50..500 => 0.05..0.50
    const morph = el('morph').checked ? 1 : 0;
    const t0 = performance.now();
    const detPtr = wasm.detect(frameBufPtr, w, h, thr, mn, mx, kStd100, gateX1000, morph);
    lastWTime = performance.now() - t0;
    const rawDets = readDetections(detPtr);
    const trackerOut = tracker.update(
      rawDets,
      +el('rad').value,
      +el('pers').value,
      +el('spread').value,
      +el('swin').value
    );
    const confirmed = trackerOut.moving;
    const stationary = trackerOut.stationary;

    // Draw background video, then overlays
    octx.drawImage(video, 0, 0, w, h);
    octx.font = '11px ui-monospace, Menlo, monospace';

    // Kill-zone rectangle (yellow dashed) — the MCU rejects fire outside this
    const kz = killZone(w, h);
    octx.save();
    octx.setLineDash([4, 3]);
    octx.strokeStyle = 'rgba(255,220,80,.55)';
    octx.lineWidth = 1;
    octx.strokeRect(kz.x0, kz.y0, kz.x1 - kz.x0, kz.y1 - kz.y0);
    octx.restore();

    // Faint grey for raw blobs (not yet confirmed)
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(160,208,160,.35)';
    for (const d of rawDets) {
      const x = Math.round(d.cx - d.w / 2), y = Math.round(d.cy - d.h / 2);
      const bw = Math.max(2, d.w | 0), bh = Math.max(2, d.h | 0);
      octx.strokeRect(x, y, bw, bh);
    }

    // Dim red X for stationary tracks (filtered out)
    octx.strokeStyle = 'rgba(255,106,106,.6)';
    for (const t of stationary) {
      const d = t.last;
      octx.beginPath();
      octx.moveTo(d.cx - 5, d.cy - 5); octx.lineTo(d.cx + 5, d.cy + 5);
      octx.moveTo(d.cx + 5, d.cy - 5); octx.lineTo(d.cx - 5, d.cy + 5);
      octx.stroke();
    }

    // Confirmed tracks: bright green with motion trail
    octx.strokeStyle = '#7fff7f';
    octx.fillStyle = 'rgba(127,255,127,.18)';
    for (const t of confirmed) {
      const d = t.last;
      const x = Math.round(d.cx - d.w / 2), y = Math.round(d.cy - d.h / 2);
      const bw = Math.max(2, d.w | 0), bh = Math.max(2, d.h | 0);
      octx.strokeRect(x, y, bw, bh);
      octx.fillRect(x, y, bw, bh);
      if (bw < 10 && bh < 10) {
        octx.beginPath();
        octx.moveTo(d.cx - 8, d.cy); octx.lineTo(d.cx + 8, d.cy);
        octx.moveTo(d.cx, d.cy - 8); octx.lineTo(d.cx, d.cy + 8);
        octx.stroke();
      }
      // trail
      if (t.history.length > 1) {
        octx.strokeStyle = 'rgba(127,255,127,.55)';
        octx.beginPath();
        octx.moveTo(t.history[0].cx, t.history[0].cy);
        for (let i = 1; i < t.history.length; i++) octx.lineTo(t.history[i].cx, t.history[i].cy);
        octx.stroke();
        octx.strokeStyle = '#7fff7f';
      }
      octx.fillStyle = '#7fff7f';
      octx.fillText('#' + t.id + ' ' + bw + 'x' + bh, x, Math.max(10, y - 2));
      octx.fillStyle = 'rgba(127,255,127,.18)';
    }

    frameN++; fpsFrames++;
    const now = performance.now();
    if (now - fpsT0 >= 500) {
      const fps = (fpsFrames * 1000 / (now - fpsT0)).toFixed(1);
      el('s_fps').textContent = fps;
      fpsFrames = 0; fpsT0 = now;
    }
    el('s_frame').textContent = frameN;
    el('s_res').textContent = w + '×' + h;
    el('s_wtime').textContent = lastWTime.toFixed(2) + ' ms';
    el('s_raw').textContent = rawDets.length;
    el('s_stat').textContent = stationary.length;
    el('s_dets').textContent = confirmed.length;

    // --- Audit: resolve pending shots from previous frames (do this BEFORE summary) ---
    audit.resolve(frameN, confirmed);
    const au = audit.summary();
    el('s_cap').textContent = au.count;
    el('s_err').textContent = isNaN(au.mean) ? '—' : au.mean.toFixed(1) + ' px';
    el('s_hits').textContent = au.count ? (100 * au.hitRate).toFixed(0) + '%  (p50 ' + (au.p50 ?? 0).toFixed(1) + ', p90 ' + (au.p90 ?? 0).toFixed(1) + ')' : '—';

    // --- Turret aim ---
    // Pick one target per frame, compute lead-predicted pixel, send to MCU.
    const fireMode = el('fireMode').value;
    // Fire gates: minAge, off cooldown, >=3 history points, recent diameter >= 4 px.
    function diamOf(h, n) {
      const k = Math.min(n, h.length);
      let m2 = 0;
      for (let i = h.length - k; i < h.length; i++)
        for (let j = i + 1; j < h.length; j++) {
          const dx = h[j].cx - h[i].cx, dy = h[j].cy - h[i].cy;
          const d2 = dx * dx + dy * dy;
          if (d2 > m2) m2 = d2;
        }
      return Math.sqrt(m2);
    }
    const fireable = confirmed.filter(t =>
      t.age >= 3 && (t.cooldown || 0) === 0 && t.history.length >= 3 && diamOf(t.history, 6) >= 4
    );
    const target = pickTarget(fireable, w, h);
    if (target) {
      const fpsNow = +el('s_fps').textContent || 30;
      const aim = predictAim(target, +el('lead').value, fpsNow);
      const inside = aim.x >= kz.x0 && aim.x <= kz.x1 && aim.y >= kz.y0 && aim.y <= kz.y1;
      const fireBit = (fireMode === 'live' && inside) ? 1 : 0;
      // Record every would-fire moment regardless of fire mode (inside kill-zone).
      if (inside) {
        audit.record(frameN, target.id, aim);
        target.cooldown = 12; // ~400 ms per-track cooldown
      }

      // Draw aim reticle on overlay
      octx.strokeStyle = fireBit ? '#ff4040' : '#ffdc50';
      octx.lineWidth = 2;
      octx.beginPath();
      octx.arc(aim.x, aim.y, 10, 0, Math.PI * 2);
      octx.moveTo(aim.x - 14, aim.y); octx.lineTo(aim.x + 14, aim.y);
      octx.moveTo(aim.x, aim.y - 14); octx.lineTo(aim.x, aim.y + 14);
      octx.stroke();

      const line = 'A ' + aim.x.toFixed(1) + ' ' + aim.y.toFixed(1) + ' ' + fireBit;
      if (fireMode === 'dry') {
        // log every ~10th frame to avoid flooding
        if (frameN % 10 === 0) say('[dry] ' + line);
      } else if (turret.connected()) {
        turret.sendLine(line);
      }
    } else if (turret.connected()) {
      // No target -> explicit release so the MCU drops fire and rearms dwell.
      turret.sendLine('A 0 0 0');
    }
  }
  requestAnimationFrame(step);
}

// ---- Temporal persistence tracker + stationary filter ----
// Nearest-neighbor assignment with 5-frame hit window; separate motion
// history used for the spread test. A "confirmed" track must be matched
// in `persistence` of the last 5 frames. A confirmed track is further
// classified as stationary if its spatial spread over the last
// `spreadWin` positions is < `minSpread` px (hover test from the Python
// ultimate_insect_detector, ~L390). Spread = max distance from history
// centroid — insensitive to small jitter around a fixed pixel.
const tracker = (() => {
  const HIT_WINDOW = 5;
  const MAX_HIST = 24;
  let tracks = []; // {id, last, history[], hits[HIT_WINDOW], age}
  let nextId = 1;

  // Diameter of the history point set (max pairwise distance). Grows
  // linearly with directed motion, stays small for jitter in place.
  // Equivalent to "has the blob visited two points at least D apart".
  function spreadOf(hist, win) {
    const n = Math.min(hist.length, win);
    if (n < 2) return Infinity;
    const start = hist.length - n;
    let maxD2 = 0;
    for (let i = start; i < hist.length; i++) {
      for (let j = i + 1; j < hist.length; j++) {
        const dx = hist[j].cx - hist[i].cx, dy = hist[j].cy - hist[i].cy;
        const d2 = dx * dx + dy * dy;
        if (d2 > maxD2) maxD2 = d2;
      }
    }
    return Math.sqrt(maxD2);
  }

  function update(dets, radius, persistence, minSpread, spreadWin) {
    const r2 = radius * radius;
    const usedDet = new Array(dets.length).fill(false);
    const matched = new Array(tracks.length).fill(-1);

    // Distance-sorted greedy assignment: enumerate (track, det) pairs
    // within radius, sort by distance ascending, assign cheapest first.
    // Prevents ID swap in dense scenes when two tracks and two detections
    // could cross-match.
    const pairs = [];
    for (let ti = 0; ti < tracks.length; ti++) {
      const t = tracks[ti];
      for (let di = 0; di < dets.length; di++) {
        const dx = dets[di].cx - t.last.cx, dy = dets[di].cy - t.last.cy;
        const d2 = dx * dx + dy * dy;
        if (d2 < r2) pairs.push([d2, ti, di]);
      }
    }
    pairs.sort((a, b) => a[0] - b[0]);
    for (const [, ti, di] of pairs) {
      if (matched[ti] !== -1 || usedDet[di]) continue;
      matched[ti] = di; usedDet[di] = true;
    }

    for (let ti = 0; ti < tracks.length; ti++) {
      const t = tracks[ti];
      const di = matched[ti];
      t.hits.push(di >= 0 ? 1 : 0);
      if (t.hits.length > HIT_WINDOW) t.hits.shift();
      if (di >= 0) {
        t.last = dets[di];
        t.history.push({ cx: dets[di].cx, cy: dets[di].cy });
        if (t.history.length > MAX_HIST) t.history.shift();
      }
      t.age++;
      if (t.cooldown > 0) t.cooldown--;
    }

    for (let i = 0; i < dets.length; i++) {
      if (usedDet[i]) continue;
      tracks.push({
        id: nextId++, last: dets[i],
        history: [{ cx: dets[i].cx, cy: dets[i].cy }],
        hits: [1], age: 1, cooldown: 0,
      });
    }

    tracks = tracks.filter(t => t.hits.some(h => h === 1));

    // Partition confirmed tracks by spread
    const moving = [], stationary = [];
    for (const t of tracks) {
      const sum = t.hits.reduce((a, b) => a + b, 0);
      if (sum < persistence) continue;
      // Only test spread once we have enough history
      if (minSpread > 0 && t.history.length >= spreadWin) {
        const spread = spreadOf(t.history, spreadWin);
        t.spread = spread;
        if (spread < minSpread) { stationary.push(t); continue; }
      }
      moving.push(t);
    }
    return { moving, stationary };
  }

  function reset() { tracks = []; nextId = 1; }

  return { update, reset };
})();

// ---- UI wiring ----
const liveMap = {
  thr: v => v,
  k: v => (v / 100).toFixed(1),
  min: v => v,
  max: v => v,
  gate: v => (v / 1000).toFixed(2),
  pers: v => v,
  rad: v => v,
  spread: v => v,
  swin: v => v,
  lead: v => v,
  kz: v => (v / 100).toFixed(2),
};
Object.entries(liveMap).forEach(([k, fmt]) => {
  const i = el(k), v = el(k + 'v');
  if (i && v) i.addEventListener('input', () => v.textContent = fmt(i.value));
});

el('start').addEventListener('click', () => setMode(el('mode').value));
el('stop').addEventListener('click', () => { stopLoop(); say('Stopped.'); });

// ---- WebSerial turret link ----
// One line per frame: "A <x> <y> <f>\n". The MCU enforces interlocks;
// browser only picks the target and sets the fire bit based on fire mode.
const turret = (() => {
  let port = null, writer = null, reader = null, readLoopP = null;
  const serStatus = el('serStatus');
  let lastSentMs = 0;

  function status(msg, err=false) {
    serStatus.textContent = msg;
    serStatus.className = 'status' + (err ? ' err' : '');
  }

  async function connect() {
    if (!('serial' in navigator)) { status('WebSerial not supported (use Chrome/Edge).', true); return; }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      const te = new TextEncoderStream();
      te.readable.pipeTo(port.writable);
      writer = te.writable.getWriter();
      const td = new TextDecoderStream();
      port.readable.pipeTo(td.writable);
      reader = td.readable.getReader();
      readLoopP = readLoop();
      status('Connected. Flip arming switch to enable.');
    } catch (e) { status('Connect failed: ' + e.message, true); }
  }

  async function disconnect() {
    try {
      if (writer) { await writer.close().catch(()=>{}); writer = null; }
      if (reader) { await reader.cancel().catch(()=>{}); reader = null; }
      if (port)   { await port.close().catch(()=>{});    port   = null; }
      status('Disconnected.');
    } catch (e) { status('Disconnect error: ' + e.message, true); }
  }

  async function readLoop() {
    let buf = '';
    try {
      while (reader) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (line.startsWith('ST ')) status('MCU: ' + line.slice(3));
          else if (line.startsWith('ERR ')) status('MCU ' + line, true);
        }
      }
    } catch (e) { status('Read ended: ' + e.message, true); }
  }

  async function sendLine(s) {
    if (!writer) return;
    try { await writer.write(s + '\n'); }
    catch (e) { status('Write failed: ' + e.message, true); }
  }

  function connected() { return !!writer; }

  return { connect, disconnect, sendLine, connected };
})();

el('serConnect').addEventListener('click', () => turret.connect());
el('serDisconnect').addEventListener('click', () => turret.disconnect());

// Draw kill-zone rectangle on the overlay and expose a hit-test.
function killZone(w, h) {
  const frac = (+el('kz').value) / 100;
  const kw = w * frac, kh = h * frac;
  const x0 = (w - kw) / 2, y0 = (h - kh) / 2;
  return { x0, y0, x1: x0 + kw, y1: y0 + kh };
}

// Pick the "best" moving track per the user-selected policy.
function pickTarget(tracks, w, h) {
  if (!tracks.length) return null;
  const mode = el('targetPick').value;
  if (mode === 'largest') {
    return tracks.reduce((a, b) => (b.last.area > a.last.area ? b : a));
  }
  if (mode === 'center') {
    const cx = w / 2, cy = h / 2;
    return tracks.reduce((a, b) => {
      const da = (a.last.cx - cx) ** 2 + (a.last.cy - cy) ** 2;
      const db = (b.last.cx - cx) ** 2 + (b.last.cy - cy) ** 2;
      return db < da ? b : a;
    });
  }
  // fastest: last-step distance in history
  return tracks.reduce((a, b) => {
    const sa = speedOf(a), sb = speedOf(b);
    return sb > sa ? b : a;
  });
}

function speedOf(t) {
  const h = t.history;
  if (h.length < 2) return 0;
  const a = h[h.length - 2], b = h[h.length - 1];
  return Math.hypot(b.cx - a.cx, b.cy - a.cy);
}

// Velocity averaged over last N step-deltas — more robust than 2-point.
function predictAim(t, leadMs, fps, nSteps = 4) {
  const h = t.history;
  if (h.length < 2 || fps <= 0) return { x: t.last.cx, y: t.last.cy };
  const n = Math.min(nSteps, h.length - 1);
  let sx = 0, sy = 0;
  for (let i = h.length - n; i < h.length; i++) {
    sx += h[i].cx - h[i - 1].cx;
    sy += h[i].cy - h[i - 1].cy;
  }
  const vx = (sx / n) * fps, vy = (sy / n) * fps;
  const dt = leadMs / 1000;
  const last = h[h.length - 1];
  return { x: last.cx + vx * dt, y: last.cy + vy * dt };
}

// ---- Audit: measure aim quality live ----
// For every would-fire moment, record predicted aim + trackId. On the
// next frame when the same track reappears, compute distance from the
// predicted aim to the actual centroid. hit = error < 8 px.
const audit = (() => {
  const HIT_PX = 8;
  const pending = new Map(); // trackId -> {frame, aim}
  const events = [];         // {frame, trackId, aim, actualNext|null, error, hit, resolved}
  function record(frame, trackId, aim) { pending.set(trackId, { frame, aim }); }
  function resolve(frame, confirmedTracks) {
    for (const t of confirmedTracks) {
      const p = pending.get(t.id);
      if (p) {
        const dx = t.last.cx - p.aim.x, dy = t.last.cy - p.aim.y;
        const err = Math.sqrt(dx*dx + dy*dy);
        events.push({ frame: p.frame, trackId: t.id, aim: p.aim,
                      actualNext: { x: t.last.cx, y: t.last.cy }, error: err,
                      hit: err < HIT_PX, resolved: true });
        pending.delete(t.id);
      }
    }
    // Tracks whose pending shots never resolved -> track lost after fire.
    const live = new Set(confirmedTracks.map(t => t.id));
    for (const [id, p] of pending) {
      if (!live.has(id) && frame - p.frame > 1) {
        events.push({ frame: p.frame, trackId: id, aim: p.aim,
                      actualNext: null, error: Infinity, hit: false,
                      resolved: false, reason: 'track_lost' });
        pending.delete(id);
      }
    }
  }
  function summary() {
    const resolved = events.filter(e => e.resolved);
    const errs = resolved.map(e => e.error).sort((a,b)=>a-b);
    const mean = errs.length ? errs.reduce((a,b)=>a+b,0)/errs.length : NaN;
    return {
      count: events.length,
      hits: events.filter(e=>e.hit).length,
      hitRate: events.length ? events.filter(e=>e.hit).length / events.length : 0,
      mean, p50: errs[Math.floor(errs.length*0.5)] ?? NaN,
      p90: errs[Math.floor(errs.length*0.9)] ?? NaN,
    };
  }
  function dump() { return JSON.stringify({ summary: summary(), events }, null, 2); }
  function reset() { pending.clear(); events.length = 0; }
  return { record, resolve, summary, dump, reset };
})();

el('auditExport').addEventListener('click', () => {
  const blob = new Blob([audit.dump()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'audit.json'; a.click();
});

initWasm().then(() => say('Ready. Pick a source and press Start.')).catch(e => say('WASM init error: ' + e.message, true));
})();
</script>
